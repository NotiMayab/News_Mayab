# =============================================================================
# Catálogo Semilla de Fuentes y Grupos Propietarios — News_Mayab
# =============================================================================
# REGLA ANTI-ECO (ADR-002 / Threat Model #6):
# Múltiples medios que comparten `ownership_group_id` cuentan como MÁXIMO 1 origen
# independiente para un mismo evento, independientemente de su redacción.

ownership_groups:
  - ownership_group_id: "GRP_MEGACOMUNICACION_YUC"
    display_name: "Grupo Megamedia / Corporativo Diario de Yucatán"
    group_type: "PRIVATE_MEDIA_GROUP"
    transparency_notes: "Grupo editorial privado regional con sede en Mérida, Yucatán."

  - ownership_group_id: "GRP_PORESTO_PENINSULA"
    display_name: "Compañía Editora del Mayab (Por Esto!)"
    group_type: "PRIVATE_MEDIA_GROUP"
    transparency_notes: "Grupo editorial impreso y digital con cobertura en Yucatán, Campeche y Quintana Roo."

  - ownership_group_id: "GRP_SIPSE"
    display_name: "Grupo SIPSE"
    group_type: "PRIVATE_MEDIA_GROUP"
    transparency_notes: "Consorcio regional de televisión, radio y prensa digital en la Península de Yucatán."

  - ownership_group_id: "GRP_GOB_ESTATAL_YUC"
    display_name: "Gobierno del Estado de Yucatán y Dependencias Estatales"
    group_type: "PUBLIC_STATE_ENTITY"
    transparency_notes: "Comunicación social oficial del Poder Ejecutivo del Estado de Yucatán. Todas sus dependencias cuentan como un único origen oficial."

  - ownership_group_id: "GRP_AYUNTAMIENTO_MERIDA"
    display_name: "Ayuntamiento de Mérida"
    group_type: "PUBLIC_STATE_ENTITY"
    transparency_notes: "Comunicación social oficial del gobierno municipal de Mérida."

  - ownership_group_id: "GRP_UADY_ACADEMIA"
    display_name: "Universidad Autónoma de Yucatán (UADY)"
    group_type: "ACADEMIC_INSTITUTION"
    transparency_notes: "Universidad pública autónoma estatal; boletines científicos, culturales e institucionales."

  - ownership_group_id: "GRP_CICY_CONAHCYT"
    display_name: "Centro de Investigación Científica de Yucatán (CICY)"
    group_type: "ACADEMIC_INSTITUTION"
    transparency_notes: "Centro público de investigación científica y tecnológica con sede en Mérida."

  - ownership_group_id: "GRP_ANIMAL_POLITICO"
    display_name: "Grupo Editorial Criterio / Animal Político"
    group_type: "INDEPENDENT_OUTLET"
    transparency_notes: "Medio digital nacional especializado en periodismo de investigación y verificación."

  - ownership_group_id: "GRP_LA_JORNADA_MAYA"
    display_name: "La Jornada Maya / Demos"
    group_type: "PRIVATE_MEDIA_GROUP"
    transparency_notes: "Edición peninsular vinculada a la franquicia periodística de La Jornada."

  - ownership_group_id: "GRP_PROCESO"
    display_name: "Comunicación e Información S.A. de C.V. (Proceso)"
    group_type: "INDEPENDENT_OUTLET"
    transparency_notes: "Revista y portal nacional de investigación periodística."

  - ownership_group_id: "GRP_DW_GLOBAL"
    display_name: "Deutsche Welle (DW Español)"
    group_type: "PUBLIC_STATE_ENTITY"
    transparency_notes: "Radiodifusora pública internacional de Alemania regulada por derecho público."

  - ownership_group_id: "GRP_BBC_MUNDO"
    display_name: "BBC News Mundo"
    group_type: "PUBLIC_STATE_ENTITY"
    transparency_notes: "Servicio público internacional británico en español."

