# =============================================================================
# Catálogo Semilla de Fuentes y Grupos Propietarios — News_Mayab
# =============================================================================
# REGLA ANTI-ECO (ADR-002 / Threat Model #6):
# Múltiples medios que comparten `ownership_group_id` cuentan como MÁXIMO 1 origen
# independiente para un mismo evento, independientemente de su redacción.

ownership_groups:
