[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mayab_news"
version = "0.1.0"
description = "Pipeline determinista de agregación transparente, detección de eco y verificación para Yucatán"
readme = "docs/decisiones.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
