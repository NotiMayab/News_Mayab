{{ define "main" }}
<div class="site-container" style="max-width: 600px; margin-block: var(--space-xl); text-align: center;">
  <p style="font-size: var(--step-4); font-family: var(--font-serif); font-weight: 800; color: var(--color-accent);">404</p>
  <h1 style="font-size: var(--step-2); margin-top: var(--space-2xs); margin-bottom: var(--space-s);">Página no encontrada</h1>
  <p style="font-size: var(--step-0); color: var(--color-text-muted); line-height: 1.6; margin-bottom: var(--space-l);">
    El enlace que intentas abrir no existe o el evento fue fusionado o retirado. En Mayab los eventos fusionados conservan redirecciones automáticas hacia el hecho principal.
  </p>
  <div style="display: flex; justify-content: center; gap: var(--space-s);">
    <a href="/" class="cat-chip" style="background: var(--color-accent); color: var(--color-accent-contrast); border-color: var(--color-accent);">
      Ir a la portada principal
    </a>
    <a href="/metodologia/" class="cat-chip">
      Consultar metodología
    </a>
  </div>
</div>
{{ end }}
