{{ define "main" }}
<article class="site-container" style="max-width: 780px; margin-block: var(--space-xl);">
  <header style="margin-bottom: var(--space-l); border-bottom: 2px solid var(--color-border); padding-bottom: var(--space-s);">
    <h1 style="font-size: var(--step-4);">{{ .Title }}</h1>
    {{ with .Date }}
      <time datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}" style="font-size: var(--step--1); color: var(--color-text-muted); display: block; margin-top: 4px;">
        Fecha de publicación: {{ .Format "02 de enero de 2006" }}
      </time>
    {{ end }}
  </header>

  <div class="static-page-content" style="font-size: var(--step-0); line-height: 1.7; display: flex; flex-direction: column; gap: var(--space-m);">
    {{ .Content }}
  </div>
</article>
{{ end }}
