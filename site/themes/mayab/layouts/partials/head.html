<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}Medio digital de registro, transparencia y trazabilidad informativa en Yucatán, México.{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">

<!-- Preload de fuentes autoalojadas -->
<link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

<!-- CSS compilado, minificado y con huella digital vía Hugo Pipes -->
{{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

<!-- JS diferido con defer -->
{{ $js := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>

<!-- Metadatos Open Graph y Twitter Card (tipográfico, sin trackers) -->
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:title" content="{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}Medio digital de registro y trazabilidad de orígenes independientes en Yucatán.{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:locale" content="es_MX">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}Trazabilidad y confirmación cruzada de noticias en Yucatán.{{ end }}">

<!-- Sindicación RSS -->
{{ with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
{{ end }}

<!-- JSON-LD Estructurado -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {{ if .IsPage }}
  "@type": "NewsArticle",
  "headline": {{ .Title | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "mainEntityOfPage": {{ .Permalink | jsonify }},
  "publisher": {
    "@type": "NewsMediaOrganization",
    "name": "Mayab",
    "url": {{ .Site.BaseURL | jsonify }}
  }
  {{ else }}
  "@type": "WebSite",
  "name": "Mayab",
  "url": {{ .Site.BaseURL | jsonify }},
  "description": "Periódico digital de registro y trazabilidad informativa en Yucatán."
  {{ end }}
}
</script>
